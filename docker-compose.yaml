version: "3.9"

services:
  # Data Stores
  postgres:
    image: postgres:16-alpine
    container_name: preeit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: preeit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: preeit-nats
    restart: unless-stopped
    command: ["-js", "-m", "${NATS_MONITOR_PORT}"]
    ports:
      - "${NATS_PORT}:4222"
      - "${NATS_MONITOR_PORT}:${NATS_MONITOR_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:${NATS_MONITOR_PORT}/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Observability
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: preeit-prometheus
    restart: unless-stopped
    volumes:
      - ./deployments/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"

  loki:
    image: grafana/loki:2.9.4
    container_name: preeit-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:10.4.0
    container_name: preeit-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml

  # Services
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: preeit-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: preeit-auth
    restart: unless-stopped
    env_file: .env
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
